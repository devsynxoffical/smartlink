<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="avGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="brushedAlum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="80%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="avGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#avBg)" rx="8" />

  <!-- Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
  </g>

  <!-- Left: Motorized Conference Table Pop-Up AV Box Graphic -->
  <g transform="translate(40, 50)">
    <!-- Table Surface Line -->
    <rect x="0" y="80" width="230" height="12" rx="2" fill="#78350f" stroke="#451a03" />
    <text x="10" y="110" font-family="monospace" font-size="8.5" fill="#94a3b8">BOARDROOM TABLE</text>

    <!-- Pop-Up Bezel & Housing -->
    <rect x="30" y="25" width="170" height="130" rx="6" fill="url(#brushedAlum)" stroke="#1e293b" stroke-width="2" />
    <rect x="38" y="33" width="154" height="114" rx="4" fill="#0f172a" stroke="#334155" />

    <!-- Pop-Up Ports Array -->
    <!-- 4K HDMI Port -->
    <g transform="translate(50, 45)">
      <rect x="0" y="0" width="36" height="24" rx="3" fill="#1e293b" stroke="#ca8a04" stroke-width="1.5" />
      <polygon points="6,6 30,6 26,18 10,18" fill="#ca8a04" />
      <text x="18" y="34" text-anchor="middle" font-family="monospace" font-size="7" fill="#facc15">HDMI 4K</text>
    </g>

    <!-- USB-C Port -->
    <g transform="translate(98, 45)">
      <rect x="0" y="0" width="36" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="8" y="8" width="20" height="8" rx="4" fill="#38bdf8" />
      <text x="18" y="34" text-anchor="middle" font-family="monospace" font-size="7" fill="#38bdf8">USB-C</text>
    </g>

    <!-- Cat6A HDBaseT Port -->
    <g transform="translate(144, 45)">
      <rect x="0" y="0" width="36" height="24" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
      <rect x="8" y="6" width="20" height="12" rx="2" fill="#22c55e" />
      <text x="18" y="34" text-anchor="middle" font-family="monospace" font-size="7" fill="#22c55e">HDBaseT</text>
    </g>

    <!-- Pop-Up Retractable Cables Dropping Under Table -->
    <path d="M68,160 C68,190 40,210 20,230" fill="none" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" />
    <path d="M116,160 C116,190 120,210 130,230" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M162,160 C162,190 190,210 220,230" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />

    <!-- Spec Callout -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="230" height="80" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="900" fill="#facc15">HDBaseT 4K UNCOMPRESSED</text>
      <text x="12" y="38" font-family="monospace" font-size="8.5" fill="#38bdf8">• 4K60 Ultra-HD Video Extension</text>
      <text x="12" y="52" font-family="monospace" font-size="8.5" fill="#22c55e">• Zero-Latency Cat6A Shielded Runs</text>
      <text x="12" y="66" font-family="monospace" font-size="8.5" fill="#e2e8f0">• Table Pop-ups &amp; Motorized Retractors</text>
    </g>
  </g>

  <!-- Right: 70V Commercial Audio & Digital Signage Card -->
  <g transform="translate(310, 45)">
    <rect x="0" y="0" width="255" height="280" rx="8" fill="#0f172a" stroke="#0056d2" stroke-width="2" />
    
    <!-- Top Header -->
    <rect x="10" y="10" width="235" height="34" rx="4" fill="#1e293b" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">70V/100V COMMERCIAL AUDIO</text>

    <!-- Ceiling Speaker Graphic -->
    <g transform="translate(30, 60)">
      <!-- Speaker Outer Ring -->
      <circle cx="40" cy="40" r="32" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <circle cx="40" cy="40" r="24" fill="#0f172a" stroke="#0056d2" stroke-width="1.5" />
      <!-- Grille Dots -->
      <circle cx="40" cy="40" r="10" fill="#334155" />
      <circle cx="40" cy="40" r="3" fill="#38bdf8" />

      <!-- Sound Wave Arcs -->
      <path d="M78,25 A25,25 0 0,1 78,55" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <path d="M88,15 A40,40 0 0,1 88,65" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

      <text x="105" y="35" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">Paging &amp; Sound</text>
      <text x="105" y="50" font-family="monospace" font-size="8.5" fill="#22c55e">70V Constant Voltage</text>
      <text x="105" y="65" font-family="sans-serif" font-size="9" fill="#94a3b8">Plenum-Rated Audio</text>
    </g>

    <!-- AV Distribution Feature List -->
    <g transform="translate(15, 160)">
      <rect x="0" y="0" width="225" height="100" rx="4" fill="#060c18" stroke="#1e293b" />
      <text x="12" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">AV Infrastructure Scope</text>
      <text x="12" y="38" font-family="monospace" font-size="8.5" fill="#22c55e">✓ Boardroom Video Walls &amp; Displays</text>
      <text x="12" y="54" font-family="monospace" font-size="8.5" fill="#22c55e">✓ Ceiling Mic Arrays &amp; DSP Audio</text>
      <text x="12" y="70" font-family="monospace" font-size="8.5" fill="#e2e8f0">• Digital Signage &amp; Menu Boards</text>
      <text x="12" y="86" font-family="monospace" font-size="8.5" fill="#e2e8f0">• Crestron / Extron Control Wiring</text>
    </g>
  </g>

  <!-- Bottom Annotation -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="540" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="20" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Low-Voltage Commercial Audio / Visual Cabling</text>
    <text x="20" y="32" font-family="monospace" font-size="9.5" fill="#38bdf8">HDBaseT 4K Video • 70V Distributed Audio • Conference Table Integration • Digital Signage</text>
  </g>
</svg>
