<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e1e" />
      <stop offset="50%" stop-color="#0b1730" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>
    <linearGradient id="copperSheath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="firestopRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bbBg)" rx="8" />

  <!-- Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
  </g>

  <!-- Left: Multi-Pair 100-Pair Riser Cable & Fire-Stop Penetration Sleeve -->
  <g transform="translate(40, 50)">
    <!-- Floor Slab Cross Section (Concrete Riser Penetration) -->
    <rect x="0" y="80" width="230" height="30" rx="2" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <text x="10" y="100" font-family="monospace" font-size="8.5" fill="#94a3b8">CONCRETE FLOOR SLAB</text>

    <!-- UL Intumescent Fire-Stop Sleeve (Red Tube through floor) -->
    <rect x="90" y="55" width="50" height="80" rx="3" fill="url(#firestopRed)" stroke="#fee2e2" stroke-width="1.5" />
    <!-- Firestop Label -->
    <text x="115" y="98" text-anchor="middle" font-family="monospace" font-size="7.5" font-weight="bold" fill="#ffffff">UL FIRE-STOP</text>

    <!-- Heavy-Duty Multi-Pair Backbone Cable (Thick Grey Riser Trunk) -->
    <rect x="105" y="10" width="20" height="170" fill="url(#copperSheath)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Fan-out of Multi-Color Twisted Pairs at top (Blue, Orange, Green, Brown, Slate bundles) -->
    <g transform="translate(105, 10)">
      <path d="M10,0 C-20,-20 -40,-10 -60,-25" fill="none" stroke="#2563eb" stroke-width="2.5" />
      <path d="M10,0 C-10,-25 -25,-20 -40,-35" fill="none" stroke="#ea580c" stroke-width="2.5" />
      <path d="M10,0 C5,-25 5,-30 0,-40" fill="none" stroke="#16a34a" stroke-width="2.5" />
      <path d="M10,0 C25,-25 35,-20 50,-35" fill="none" stroke="#854d0e" stroke-width="2.5" />
      <path d="M10,0 C35,-20 55,-10 70,-25" fill="none" stroke="#64748b" stroke-width="2.5" />
    </g>

    <!-- Cable Spec Callout Card -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="230" height="80" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="900" fill="#facc15">100-PAIR ARMM/CMR RISER</text>
      <text x="12" y="38" font-family="monospace" font-size="8.5" fill="#38bdf8">• 25/50/100-Pair Core Bundles</text>
      <text x="12" y="52" font-family="monospace" font-size="8.5" fill="#22c55e">• UL 1479 Intumescent Fire-Stop</text>
      <text x="12" y="66" font-family="monospace" font-size="8.5" fill="#e2e8f0">• Lightning &amp; Surge Suppression</text>
    </g>
  </g>

  <!-- Right: 110-Block Cross-Connect Wiring Frame -->
  <g transform="translate(310, 45)">
    <rect x="0" y="0" width="255" height="280" rx="8" fill="#0f172a" stroke="#0056d2" stroke-width="2" />
    
    <!-- Top Header -->
    <rect x="10" y="10" width="235" height="34" rx="4" fill="#1e293b" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">110 CROSS-CONNECT BLOCK</text>

    <!-- 110 Punch-Down Blocks Grid Graphic -->
    <g transform="translate(20, 55)">
      <!-- Block Row 1 -->
      <rect x="0" y="0" width="215" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="10" y1="18" x2="205" y2="18" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3" />
      <text x="10" y="30" font-family="monospace" font-size="7.5" font-weight="bold" fill="#0f172a">BLOCK A: PAIRS 01-25 [MDF-IDF1]</text>

      <!-- Block Row 2 -->
      <rect x="0" y="44" width="215" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="10" y1="62" x2="205" y2="62" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,3" />
      <text x="10" y="74" font-family="monospace" font-size="7.5" font-weight="bold" fill="#0f172a">BLOCK B: PAIRS 26-50 [MDF-IDF2]</text>

      <!-- Block Row 3 -->
      <rect x="0" y="88" width="215" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="10" y1="106" x2="205" y2="106" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" />
      <text x="10" y="118" font-family="monospace" font-size="7.5" font-weight="bold" fill="#0f172a">BLOCK C: PAIRS 51-75 [MDF-IDF3]</text>

      <!-- Block Row 4 -->
      <rect x="0" y="132" width="215" height="36" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <line x1="10" y1="150" x2="205" y2="150" stroke="#854d0e" stroke-width="2" stroke-dasharray="6,3" />
      <text x="10" y="162" font-family="monospace" font-size="7.5" font-weight="bold" fill="#0f172a">BLOCK D: PAIRS 76-100 [MDF-IDF4]</text>
    </g>

    <!-- Punch-Down Jumper Dressing Specs -->
    <g transform="translate(15, 235)">
      <text x="10" y="16" font-family="monospace" font-size="9" fill="#22c55e">✓ BICSI TDMM Multi-Floor Standard</text>
      <text x="10" y="30" font-family="sans-serif" font-size="9" fill="#94a3b8">Cross-Connect Field Termination</text>
    </g>
  </g>

  <!-- Bottom Annotation -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="540" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="20" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Copper Backbone &amp; Inter-Floor Riser Infrastructure</text>
    <text x="20" y="32" font-family="monospace" font-size="9.5" fill="#38bdf8">High-Pair Distribution • 110 Cross-Connects • Intumescent Floor Penetration Fire-Stopping</text>
  </g>
</svg>
