<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="indBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="60%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="metalConduit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="hazardYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="industrialGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="indGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#indBg)" rx="8" />

  <!-- Industrial Plant Grid / Piping Silhouette Background -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1.5">
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="260" y1="0" x2="260" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="520" y1="0" x2="520" y2="400" />
  </g>

  <!-- Top Hazard Warning Stripe Banner -->
  <g transform="translate(0, 0)">
    <rect width="600" height="12" fill="#eab308" />
    <line x1="20" y1="0" x2="35" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="60" y1="0" x2="75" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="100" y1="0" x2="115" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="140" y1="0" x2="155" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="180" y1="0" x2="195" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="220" y1="0" x2="235" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="260" y1="0" x2="275" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="300" y1="0" x2="315" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="340" y1="0" x2="355" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="380" y1="0" x2="395" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="420" y1="0" x2="435" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="460" y1="0" x2="475" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="500" y1="0" x2="515" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="540" y1="0" x2="555" y2="12" stroke="#000000" stroke-width="8" />
    <line x1="580" y1="0" x2="595" y2="12" stroke="#000000" stroke-width="8" />
  </g>

  <!-- Left: Industrial Heavy-Wall Metallic Conduit & Shielded SF/UTP Cable -->
  <g transform="translate(40, 50)">
    <!-- Rigid Steel Conduit Tube -->
    <rect x="0" y="40" width="220" height="48" rx="4" fill="url(#metalConduit)" stroke="#334155" stroke-width="2" />
    <!-- Conduit Joint Coupling Ring -->
    <rect x="90" y="36" width="30" height="56" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
    <!-- Grounding Wire Bond Clamp -->
    <circle cx="105" cy="64" r="5" fill="#ca8a04" stroke="#713f12" stroke-width="1.5" />
    <path d="M105,64 C105,100 80,120 40,130" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="8,4" />

    <!-- Ruggedized Shielded Teal/Green Industrial SF/UTP Cable Exiting Conduit -->
    <path d="M220,64 C260,64 260,140 300,140" fill="none" stroke="#059669" stroke-width="16" stroke-linecap="round" />
    <path d="M220,64 C260,64 260,140 300,140" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cable Cross Section Anatomy Card -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="240" height="120" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#facc15">SF/UTP SHIELDING LAYERS</text>
      
      <text x="14" y="46" font-family="monospace" font-size="9" fill="#e2e8f0">• Outer PUR Oil-Resistant Jacket</text>
      <text x="14" y="64" font-family="monospace" font-size="9" fill="#38bdf8">• Tinned Copper Braid (85% Shield)</text>
      <text x="14" y="82" font-family="monospace" font-size="9" fill="#38bdf8">• 100% Aluminum Foil Mylar Wrap</text>
      <text x="14" y="100" font-family="monospace" font-size="9" fill="#22c55e">• 4-Pair 24AWG Solid Copper Core</text>
    </g>
  </g>

  <!-- Right: IP67 Sealed Circular M12 / Heavy Duty Industrial RJ45 Connector -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="245" height="270" rx="8" fill="#0f172a" stroke="#0056d2" stroke-width="2" />
    
    <!-- Header -->
    <rect x="10" y="10" width="225" height="34" rx="4" fill="#1e293b" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">IP67 INDUSTRIAL CONNECTOR</text>

    <!-- Waterproof Connector Housing Graphic -->
    <g transform="translate(35, 60)">
      <!-- Outer Threaded Stainless Barrel -->
      <rect x="20" y="10" width="130" height="60" rx="6" fill="url(#metalConduit)" stroke="#334155" stroke-width="2" />
      <!-- Knurled Grips -->
      <line x1="35" y1="12" x2="35" y2="68" stroke="#475569" stroke-width="2" />
      <line x1="45" y1="12" x2="45" y2="68" stroke="#475569" stroke-width="2" />
      <line x1="55" y1="12" x2="55" y2="68" stroke="#475569" stroke-width="2" />

      <!-- O-Ring Rubber Seal Ring -->
      <rect x="80" y="8" width="10" height="64" rx="2" fill="#ef4444" />
      
      <!-- Gold Pin Array (M12 X-Coded 8-Pin High-Speed 10Gbps) -->
      <circle cx="120" cy="40" r="18" fill="#0f172a" stroke="#ca8a04" stroke-width="2" />
      <circle cx="112" cy="34" r="2.5" fill="#facc15" />
      <circle cx="128" cy="34" r="2.5" fill="#facc15" />
      <circle cx="112" cy="46" r="2.5" fill="#facc15" />
      <circle cx="128" cy="46" r="2.5" fill="#facc15" />
      <circle cx="120" cy="28" r="2.5" fill="#facc15" />
      <circle cx="120" cy="52" r="2.5" fill="#facc15" />
      <circle cx="106" cy="40" r="2.5" fill="#facc15" />
      <circle cx="134" cy="40" r="2.5" fill="#facc15" />
    </g>

    <!-- Industrial Plant Resilience Specs -->
    <g transform="translate(15, 155)">
      <rect x="0" y="0" width="215" height="100" rx="4" fill="#060c18" stroke="#1e293b" />
      <text x="12" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Harsh Environment Ratings</text>
      <text x="12" y="38" font-family="monospace" font-size="9" fill="#22c55e">✓ IP67 / NEMA 4X Washdown</text>
      <text x="12" y="54" font-family="monospace" font-size="9" fill="#22c55e">✓ Heavy EMI Noise Immunity</text>
      <text x="12" y="70" font-family="monospace" font-size="9" fill="#e2e8f0">• Oil, Chemical &amp; UV Resistant</text>
      <text x="12" y="86" font-family="monospace" font-size="9" fill="#e2e8f0">• High-Vibration Machine Flex</text>
    </g>
  </g>

  <!-- Bottom Annotation -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="540" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="20" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#facc15">Industrial Plant &amp; Automation Cabling Architecture</text>
    <text x="20" y="32" font-family="monospace" font-size="9.5" fill="#38bdf8">Shielded SF/UTP • M12 X-Code • Rigid Conduit Runs • Factory Floor Certified</text>
  </g>
</svg>
