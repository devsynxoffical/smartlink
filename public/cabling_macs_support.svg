<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="macsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#0e1e38" />
      <stop offset="100%" stop-color="#060d1b" />
    </linearGradient>
    <linearGradient id="probeYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="toneBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056d2" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="probeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#macsBg)" rx="8" />

  <!-- Grid Pattern -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="140" x2="600" y2="140" />
    <line x1="0" y1="210" x2="600" y2="210" />
    <line x1="0" y1="280" x2="600" y2="280" />
    <line x1="0" y1="350" x2="600" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
  </g>

  <!-- Left: Tone Generator & Digital Inductive Probe Tool Set -->
  <g transform="translate(40, 50)">
    <!-- Tone Generator Box -->
    <rect x="0" y="20" width="100" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="10" y="32" width="80" height="35" rx="4" fill="#0f172a" stroke="#0056d2" />
    <text x="50" y="48" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#38bdf8" font-weight="bold">TONE GEN</text>
    <text x="50" y="60" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">ACTIVE: 1kHz</text>
    
    <!-- Status LED -->
    <circle cx="50" cy="85" r="4" fill="#22c55e" filter="url(#probeGlow)" />
    <!-- Toggle Switches -->
    <rect x="25" y="105" width="50" height="14" rx="2" fill="#0f172a" />
    <circle cx="40" cy="112" r="4" fill="#facc15" />
    <!-- Output RJ45 Jack -->
    <rect x="35" y="140" width="30" height="16" rx="2" fill="#020617" />

    <!-- Inductive Probe Tracer Wand -->
    <g transform="translate(130, 0)">
      <!-- Wand Handle & Body -->
      <polygon points="25,0 45,0 55,200 15,200" fill="url(#probeYellow)" stroke="#a16207" stroke-width="1.5" />
      <rect x="22" y="50" width="26" height="70" rx="3" fill="#1e293b" />
      <!-- Power button & speaker grille -->
      <circle cx="35" cy="65" r="6" fill="#ef4444" />
      <line x1="28" y1="85" x2="42" y2="85" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="28" y1="95" x2="42" y2="95" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="28" y1="105" x2="42" y2="105" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Tracer Probe Tip Glow -->
      <polygon points="30,-15 40,-15 45,0 25,0" fill="#38bdf8" filter="url(#probeGlow)" />
      <circle cx="35" cy="-10" r="3" fill="#ffffff" />
    </g>

    <!-- Signal Tone Waves radiating from Probe Tip -->
    <path d="M150,15 A25,25 0 0,1 185,40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
    <path d="M145,5 A40,40 0 0,1 200,45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M140,-5 A55,55 0 0,1 215,50" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5" />

    <!-- Floor Box / Workstation Faceplate Graphic -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="240" height="85" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">Workstation Drop #D-104</text>
      <!-- 4-Port Faceplate Jacks -->
      <rect x="14" y="32" width="45" height="38" rx="3" fill="#1e293b" stroke="#0056d2" />
      <text x="36" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">VOIP</text>

      <rect x="68" y="32" width="45" height="38" rx="3" fill="#1e293b" stroke="#0056d2" />
      <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">DATA</text>

      <rect x="122" y="32" width="45" height="38" rx="3" fill="#1e293b" stroke="#22c55e" />
      <text x="144" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">NEW</text>

      <rect x="176" y="32" width="45" height="38" rx="3" fill="#1e293b" stroke="#f59e0b" />
      <text x="198" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="#f59e0b">SPARE</text>
    </g>
  </g>

  <!-- Right: Day-Two MACs Dispatch & Scheduling Card -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="245" height="275" rx="8" fill="#0f172a" stroke="#0056d2" stroke-width="2" />
    
    <!-- Top Header -->
    <rect x="10" y="10" width="225" height="34" rx="4" fill="#1e293b" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">DAY-TWO MAC SERVICES</text>

    <!-- SLA & Modification Activities -->
    <g transform="translate(15, 60)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="215" height="42" rx="4" fill="#060c18" stroke="#1e293b" />
      <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Office Reconfiguration</text>
      <text x="12" y="32" font-family="monospace" font-size="8.5" fill="#38bdf8">Cubicle Moves &amp; Drop Extensions</text>

      <!-- Item 2 -->
      <rect x="0" y="50" width="215" height="42" rx="4" fill="#060c18" stroke="#1e293b" />
      <text x="12" y="68" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Drop Additions &amp; Patching</text>
      <text x="12" y="82" font-family="monospace" font-size="8.5" fill="#22c55e">Instant Tone Trace &amp; Port Activation</text>

      <!-- Item 3 -->
      <rect x="0" y="100" width="215" height="42" rx="4" fill="#060c18" stroke="#1e293b" />
      <text x="12" y="118" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Cable Abatement (NEC)</text>
      <text x="12" y="132" font-family="monospace" font-size="8.5" fill="#f59e0b">Abandoned Cable Decommissioning</text>

      <!-- Item 4 -->
      <rect x="0" y="150" width="215" height="42" rx="4" fill="#060c18" stroke="#1e293b" />
      <text x="12" y="168" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">CAD As-Built Updates</text>
      <text x="12" y="182" font-family="monospace" font-size="8.5" fill="#94a3b8">Drop Schedule Documentation</text>
    </g>
  </g>

  <!-- Bottom Annotation -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="540" height="42" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="20" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Moves, Adds &amp; Changes (MACs) Support</text>
    <text x="20" y="32" font-family="monospace" font-size="9.5" fill="#22c55e">Rapid Field Dispatch • Tone Tracing • Drop Additions • Fluke Certified Completion</text>
  </g>
</svg>
