<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dasMaintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0075ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#dasMaintBg)" />

  <!-- Subtle RF Grid overlay -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" stroke-dasharray="4,4" />
    <line x1="0" y1="160" x2="600" y2="160" stroke-dasharray="4,4" />
    <line x1="0" y1="240" x2="600" y2="240" stroke-dasharray="4,4" />
    <line x1="0" y1="320" x2="600" y2="320" stroke-dasharray="4,4" />
    <line x1="150" y1="0" x2="150" y2="400" stroke-dasharray="4,4" />
    <line x1="300" y1="0" x2="300" y2="400" stroke-dasharray="4,4" />
    <line x1="450" y1="0" x2="450" y2="400" stroke-dasharray="4,4" />
  </g>

  <!-- Header NOC Status Bar -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="540" height="42" rx="8" fill="#131e38" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="22" cy="21" r="6" fill="#22c55e" />
    <text x="36" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">DAS LIFECYCLE MANAGEMENT &amp; 24/7 NOC MONITORING</text>
    <rect x="430" y="10" width="95" height="22" rx="4" fill="#0075ff" opacity="0.2" stroke="#0075ff" stroke-width="1" />
    <text x="477" y="25" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8">SYSTEM ONLINE</text>
  </g>

  <!-- Main Content Dashboard Grid -->
  <g transform="translate(30, 80)">
    <!-- Column 1: BDA & RF Signal Health (Left Box) -->
    <g filter="url(#boxShadow)">
      <rect x="0" y="0" width="255" height="280" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="255" height="34" rx="10" fill="#1e293b" />
      <text x="16" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">BDA / ERRCS TELEMETRY</text>
      <circle cx="236" cy="17" r="4" fill="#22c55e" />

      <!-- Metrics Rows -->
      <!-- 1. Donor Signal Level -->
      <g transform="translate(16, 48)">
        <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Donor Signal (Uplink/DL)</text>
        <text x="223" y="14" text-anchor="end" font-family="monospace" font-size="12" font-weight="bold" fill="#22c55e">-58 dBm (Optimal)</text>
        <rect x="0" y="22" width="223" height="6" rx="3" fill="#0f172a" />
        <rect x="0" y="22" width="195" height="6" rx="3" fill="url(#cyanGrad)" />
      </g>

      <!-- 2. BDA Active Gain -->
      <g transform="translate(16, 95)">
        <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Active Gain (700/800 MHz)</text>
        <text x="223" y="14" text-anchor="end" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">+85 dB (Locked)</text>
        <rect x="0" y="22" width="223" height="6" rx="3" fill="#0f172a" />
        <rect x="0" y="22" width="180" height="6" rx="3" fill="#0075ff" />
      </g>

      <!-- 3. Return Loss & VSWR -->
      <g transform="translate(16, 142)">
        <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Line VSWR / Return Loss</text>
        <text x="223" y="14" text-anchor="end" font-family="monospace" font-size="12" font-weight="bold" fill="#22c55e">1.18:1 (&gt; 22 dB)</text>
        <rect x="0" y="22" width="223" height="6" rx="3" fill="#0f172a" />
        <rect x="0" y="22" width="205" height="6" rx="3" fill="#10b981" />
      </g>

      <!-- 4. NFPA 1221 Battery Backup -->
      <g transform="translate(16, 189)">
        <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">NFPA 1221 Battery Health</text>
        <text x="223" y="14" text-anchor="end" font-family="monospace" font-size="12" font-weight="bold" fill="#22c55e">100% (28.4V Float)</text>
        <rect x="0" y="22" width="223" height="6" rx="3" fill="#0f172a" />
        <rect x="0" y="22" width="223" height="6" rx="3" fill="#22c55e" />
      </g>

      <!-- Status Tag -->
      <rect x="16" y="242" width="223" height="24" rx="4" fill="#032b1b" stroke="#059669" stroke-width="1" />
      <text x="127" y="258" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">✓ AHJ COMPLIANCE CERTIFIED</text>
    </g>

    <!-- Column 2: Multi-Carrier & SLA Response (Right Box) -->
    <g transform="translate(285, 0)" filter="url(#boxShadow)">
      <rect x="0" y="0" width="255" height="280" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="255" height="34" rx="10" fill="#1e293b" />
      <text x="16" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">CARRIER &amp; SLA OPERATIONS</text>
      <circle cx="236" cy="17" r="4" fill="#22c55e" />

      <!-- Carrier Band Status Rows -->
      <g transform="translate(16, 48)">
        <rect x="0" y="0" width="223" height="34" rx="6" fill="#131e38" stroke="#1e3a5f" />
        <circle cx="16" cy="17" r="4" fill="#22c55e" />
        <text x="28" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">Verizon / AT&amp;T / T-Mobile</text>
        <text x="210" y="21" text-anchor="end" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">5G / LTE</text>
      </g>

      <g transform="translate(16, 92)">
        <rect x="0" y="0" width="223" height="34" rx="6" fill="#131e38" stroke="#1e3a5f" />
        <circle cx="16" cy="17" r="4" fill="#22c55e" />
        <text x="28" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">Public Safety Band 14 (ERRCS)</text>
        <text x="210" y="21" text-anchor="end" font-family="monospace" font-size="11" font-weight="bold" fill="#22c55e">ACTIVE</text>
      </g>

      <g transform="translate(16, 136)">
        <rect x="0" y="0" width="223" height="34" rx="6" fill="#131e38" stroke="#1e3a5f" />
        <circle cx="16" cy="17" r="4" fill="#22c55e" />
        <text x="28" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">CBRS / Private 5G Microcells</text>
        <text x="210" y="21" text-anchor="end" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">SYNCED</text>
      </g>

      <g transform="translate(16, 180)">
        <rect x="0" y="0" width="223" height="42" rx="6" fill="#0c2340" stroke="#0075ff" stroke-width="1.2" />
        <text x="12" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8">SLA RAPID ON-SITE DISPATCH</text>
        <text x="12" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">2-Hour &amp; 4-Hour Guaranteed MTTR</text>
      </g>

      <!-- Annual Audit Badge -->
      <rect x="16" y="234" width="223" height="32" rx="6" fill="#1e293b" />
      <text x="111" y="254" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Annual Mandated RF Re-Certification</text>
    </g>
  </g>
</svg>
