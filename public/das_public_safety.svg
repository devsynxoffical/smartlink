<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="60%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="conduitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="8" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="600" height="400" fill="url(#wallBg)" />
  
  <!-- Subtle Wall Grid / Brick Joint Lines -->
  <line x1="0" y1="130" x2="600" y2="130" stroke="#94a3b8" stroke-width="2" opacity="0.6" />
  <line x1="0" y1="270" x2="600" y2="270" stroke="#94a3b8" stroke-width="2" opacity="0.6" />
  <line x1="180" y1="0" x2="180" y2="130" stroke="#94a3b8" stroke-width="2" opacity="0.5" />
  <line x1="420" y1="130" x2="420" y2="270" stroke="#94a3b8" stroke-width="2" opacity="0.5" />
  <line x1="220" y1="270" x2="220" y2="400" stroke="#94a3b8" stroke-width="2" opacity="0.5" />

  <!-- Top Electrical Metallic Tubing (EMT) Conduits -->
  <rect x="250" y="0" width="18" height="50" fill="url(#conduitGrad)" />
  <rect x="330" y="0" width="22" height="50" fill="url(#conduitGrad)" />
  <!-- Conduit fittings -->
  <rect x="246" y="44" width="26" height="8" rx="2" fill="#64748b" />
  <rect x="325" y="44" width="32" height="8" rx="2" fill="#64748b" />

  <!-- Red NEMA 4 Enclosure Box -->
  <g filter="url(#boxShadow)">
    <!-- Outer flange with mounting holes -->
    <rect x="180" y="48" width="240" height="304" rx="10" fill="#991b1b" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="190" cy="58" r="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="410" cy="58" r="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="190" cy="342" r="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="410" cy="342" r="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Main Door Bezel -->
    <rect x="190" y="55" width="220" height="290" rx="8" fill="url(#boxGrad)" stroke="url(#bezelGrad)" stroke-width="3" />
    
    <!-- Heavy-Duty Door Latches on Right -->
    <rect x="403" y="110" width="12" height="34" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
    <rect x="403" y="250" width="12" height="34" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" />
    
    <!-- Hinges on Left -->
    <rect x="186" y="105" width="8" height="28" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1" />
    <rect x="186" y="260" width="8" height="28" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1" />

    <!-- Recessed Center Panel -->
    <rect x="210" y="80" width="180" height="240" rx="6" fill="#b91c1c" stroke="#991b1b" stroke-width="1.5" />

    <!-- First Responder Emergency Radio Icon -->
    <g transform="translate(300, 140)">
      <!-- Shield / Firefighter badge -->
      <path d="M0,-35 L26,-22 C26,8 14,26 0,35 C-14,26 -26,8 -26,-22 Z" fill="#ffffff" opacity="0.95" />
      <path d="M0,-30 L22,-18 C22,6 12,22 0,30 C-12,22 -22,6 -22,-18 Z" fill="#dc2626" />
      
      <!-- Radio tower waves inside shield -->
      <circle cx="0" cy="6" r="3.5" fill="#ffffff" />
      <path d="M-6,-2 C-2,-6 2,-6 6,-2" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
      <path d="M-11,-7 C-4,-14 4,-14 11,-7" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
      <path d="M-16,-12 C-6,-22 6,-22 16,-12" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- Prominent "PUBLIC SAFETY" Text -->
    <text x="300" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="2">PUBLIC SAFETY</text>
    
    <!-- Subtitle: BDA / ERRCS SYSTEM -->
    <text x="300" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#fecaca" letter-spacing="1.5">700 / 800 MHz BDA · ERRCS</text>

    <!-- Status LEDs strip -->
    <g transform="translate(230, 260)">
      <rect x="0" y="0" width="140" height="28" rx="4" fill="#18181b" />
      <!-- Power Green LED -->
      <circle cx="20" cy="14" r="5" fill="#22c55e" />
      <text x="32" y="17" font-family="sans-serif" font-size="9" font-weight="700" fill="#a1a1aa">PWR</text>
      <!-- Normal Green LED -->
      <circle cx="70" cy="14" r="5" fill="#22c55e" />
      <text x="82" y="17" font-family="sans-serif" font-size="9" font-weight="700" fill="#a1a1aa">NORM</text>
      <!-- Alarm Amber/Off LED -->
      <circle cx="120" cy="14" r="4.5" fill="#3f3f46" stroke="#71717a" stroke-width="1" />
    </g>

    <!-- Certification Compliance Badges (NFPA 1221 / IFC 510) -->
    <rect x="235" y="300" width="130" height="15" rx="3" fill="#ffffff" opacity="0.15" />
    <text x="300" y="311" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" letter-spacing="1">NFPA 1221 · IFC 510 · UL 2524</text>
  </g>
</svg>
