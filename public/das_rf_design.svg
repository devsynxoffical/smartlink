<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="rfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="silverCavity" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="blueCable" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="rfGlow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Tech Engineering Bench Background -->
  <rect width="600" height="400" fill="url(#rfBg)" />

  <!-- Blueprint / CAD RF Design Grid & Smith Chart overlay in background -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
    <!-- Grid -->
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="280" x2="600" y2="280" />
    <line x1="0" y1="380" x2="600" y2="380" />
    
    <!-- Smith chart circle arcs -->
    <circle cx="480" cy="200" r="90" fill="none" stroke-dasharray="4,4" />
    <circle cx="525" cy="200" r="45" fill="none" />
    <path d="M390,200 A90,90 0 0,1 480,110" fill="none" />
    <path d="M390,200 A90,90 0 0,0 480,290" fill="none" />
  </g>

  <!-- Flexible RF Coaxial Cables (Blue low-loss plenum jumpers) -->
  <path d="M0,130 C120,130 140,165 210,165" fill="none" stroke="url(#blueCable)" stroke-width="20" stroke-linecap="round" />
  <path d="M0,130 C120,130 140,165 210,165" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" />

  <path d="M390,120 C460,120 500,70 600,60" fill="none" stroke="url(#blueCable)" stroke-width="18" stroke-linecap="round" />
  <path d="M390,210 C460,210 520,260 600,270" fill="none" stroke="url(#blueCable)" stroke-width="18" stroke-linecap="round" />

  <!-- RF Power Splitter / Directional Coupler Cavity Block -->
  <g filter="url(#rfGlow)" transform="translate(190, 85)">
    <!-- Aluminum Cavity Body -->
    <rect x="20" y="20" width="180" height="150" rx="8" fill="url(#silverCavity)" stroke="#334155" stroke-width="2" />
    
    <!-- Mounting Screws in 4 Corners -->
    <circle cx="32" cy="32" r="4" fill="#334155" stroke="#94a3b8" />
    <circle cx="188" cy="32" r="4" fill="#334155" stroke="#94a3b8" />
    <circle cx="32" cy="158" r="4" fill="#334155" stroke="#94a3b8" />
    <circle cx="188" cy="158" r="4" fill="#334155" stroke="#94a3b8" />

    <!-- Technical Nameplate / Engraving on Splitter -->
    <rect x="45" y="45" width="130" height="100" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="110" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#38bdf8" letter-spacing="1">RF HYBRID COUPLER</text>
    <text x="110" y="82" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">FREQ: 698 - 3800 MHz</text>
    <text x="110" y="96" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">IMPEDANCE: 50 OHM</text>
    <text x="110" y="112" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">LOW PIM: &lt; -160 dBc</text>
    <text x="110" y="130" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#f59e0b">SPLIT LOSS: 3.0 dB</text>

    <!-- Input Port Left (Gold/Brass N-Connector) -->
    <g transform="translate(0, 70)">
      <rect x="-18" y="0" width="22" height="20" rx="2" fill="url(#brassGold)" stroke="#713f12" stroke-width="1.5" />
      <!-- Knurled threads -->
      <line x1="-12" y1="2" x2="-12" y2="18" stroke="#713f12" stroke-width="1.5" />
      <line x1="-7" y1="2" x2="-7" y2="18" stroke="#713f12" stroke-width="1.5" />
      <line x1="-2" y1="2" x2="-2" y2="18" stroke="#713f12" stroke-width="1.5" />
    </g>

    <!-- Output Port 1 Right Top (Gold N-Connector) -->
    <g transform="translate(196, 25)">
      <rect x="0" y="0" width="22" height="20" rx="2" fill="url(#brassGold)" stroke="#713f12" stroke-width="1.5" />
      <line x1="5" y1="2" x2="5" y2="18" stroke="#713f12" stroke-width="1.5" />
      <line x1="10" y1="2" x2="10" y2="18" stroke="#713f12" stroke-width="1.5" />
      <line x1="15" y1="2" x2="15" y2="18" stroke="#713f12" stroke-width="1.5" />
    </g>

    <!-- Output Port 2 Right Bottom (Gold N-Connector) -->
    <g transform="translate(196, 115)">
      <rect x="0" y="0" width="22" height="20" rx="2" fill="url(#brassGold)" stroke="#713f12" stroke-width="1.5" />
      <line x1="5" y1="2" x2="5" y2="18" stroke="#713f12" stroke-width="1.5" />
      <line x1="10" y1="2" x2="10" y2="18" stroke="#713f12" stroke-width="1.5" />
      <line x1="15" y1="2" x2="15" y2="18" stroke="#713f12" stroke-width="1.5" />
    </g>
  </g>

  <!-- Engineering Annotation Badges -->
  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155" />
    <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">iBwave 3D RF Modeling</text>
    <text x="14" y="38" font-family="monospace" font-size="9.5" fill="#38bdf8">Link Budget: 100% Validated</text>
  </g>

  <g transform="translate(340, 310)">
    <rect x="0" y="0" width="220" height="50" rx="6" fill="#1e293b" opacity="0.9" stroke="#334155" />
    <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Low-PIM RF Distribution</text>
    <text x="14" y="38" font-family="monospace" font-size="9.5" fill="#22c55e">VSWR &lt; 1.25:1 Across All Bands</text>
  </g>
</svg>
