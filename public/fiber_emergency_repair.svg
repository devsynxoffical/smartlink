<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="60%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="otdrScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="redLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="laserRedGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#diagBg)" rx="8" />

  <!-- Left: OTDR Optical Trace Diagnostic Screen Frame -->
  <g transform="translate(30, 45)">
    <!-- Ruggedized Test Set Body -->
    <rect x="0" y="0" width="310" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <!-- Bumper Corners -->
    <rect x="-4" y="-4" width="20" height="20" rx="4" fill="#0056d2" />
    <rect x="294" y="-4" width="20" height="20" rx="4" fill="#0056d2" />
    <rect x="-4" y="244" width="20" height="20" rx="4" fill="#0056d2" />
    <rect x="294" y="244" width="20" height="20" rx="4" fill="#0056d2" />

    <!-- LCD Display -->
    <rect x="15" y="15" width="280" height="230" rx="6" fill="#021a15" stroke="#065f46" stroke-width="1.5" />

    <!-- Display Header -->
    <rect x="20" y="20" width="270" height="22" rx="2" fill="#064e3b" />
    <text x="28" y="35" font-family="monospace" font-size="10" font-weight="bold" fill="#34d399">OTDR TRACE • 1310nm SM</text>
    <text x="230" y="35" font-family="monospace" font-size="10" font-weight="bold" fill="#facc15">PULSE: 20ns</text>

    <!-- Grid lines -->
    <g opacity="0.3" stroke="#059669" stroke-width="0.8">
      <line x1="20" y1="70" x2="290" y2="70" />
      <line x1="20" y1="105" x2="290" y2="105" />
      <line x1="20" y1="140" x2="290" y2="140" />
      <line x1="20" y1="175" x2="290" y2="175" />
      <line x1="65" y1="45" x2="65" y2="200" />
      <line x1="110" y1="45" x2="110" y2="200" />
      <line x1="155" y1="45" x2="155" y2="200" />
      <line x1="200" y1="45" x2="200" y2="200" />
      <line x1="245" y1="45" x2="245" y2="200" />
    </g>

    <!-- OTDR Trace Curve (Initial reflection, backscatter slope, splice event, break peak) -->
    <!-- Launch Fresnel Reflection Spike -->
    <path d="M20,180 L28,60 L32,100 L110,120 L110,110 L114,130 L180,145 L180,75 L186,195 L290,195" fill="none" stroke="#10b981" stroke-width="2.5" />
    <path d="M20,180 L28,60 L32,100 L110,120 L110,110 L114,130 L180,145 L180,75 L186,195 L290,195" fill="none" stroke="#6ee7b7" stroke-width="1" />

    <!-- Event 1 Marker: Splice -->
    <circle cx="112" cy="120" r="4" fill="#38bdf8" />
    <text x="100" y="98" font-family="monospace" font-size="8.5" fill="#38bdf8">Splice: 0.02dB</text>

    <!-- Event 2 Marker: Fiber Fault / Break -->
    <circle cx="183" cy="75" r="5" fill="#ef4444" filter="url(#laserRedGlow)" />
    <!-- Pinpoint line -->
    <line x1="183" y1="75" x2="183" y2="200" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2" />
    <rect x="145" y="55" width="76" height="16" rx="2" fill="#ef4444" />
    <text x="183" y="66" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff">FAULT: 412.8m</text>

    <!-- Bottom Status Bar -->
    <rect x="20" y="205" width="270" height="34" rx="3" fill="#042f2e" stroke="#0f766e" />
    <text x="28" y="220" font-family="monospace" font-size="9" fill="#22c55e">STATUS: FAULT ISOLATED</text>
    <text x="28" y="233" font-family="monospace" font-size="8.5" fill="#94a3b8">Reflectance: -38.4 dB • End of Fiber</text>
  </g>

  <!-- Right: VFL Laser Light & Fusion Alignment Visualizer -->
  <g transform="translate(360, 45)">
    <!-- Card Container -->
    <rect x="0" y="0" width="210" height="260" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

    <!-- Card Header -->
    <rect x="10" y="10" width="190" height="30" rx="4" fill="#1e293b" />
    <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="800" fill="#38bdf8">FIBER RESTORATION</text>

    <!-- Visual Fault Locator (VFL) Red Laser Fiber Graphic -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="170" height="75" rx="6" fill="#060c18" stroke="#334155" />
      <text x="10" y="18" font-family="monospace" font-size="8" fill="#94a3b8">VFL RED LASER (650nm)</text>
      
      <!-- Glowing Red Laser Beam through Optical Glass Strand -->
      <line x1="15" y1="42" x2="80" y2="42" stroke="url(#redLaser)" stroke-width="4" filter="url(#laserRedGlow)" />
      <line x1="15" y1="42" x2="80" y2="42" stroke="#ffffff" stroke-width="1.5" />
      <!-- Fiber Core Fracture Glow Escape -->
      <circle cx="85" cy="42" r="10" fill="#ef4444" opacity="0.8" filter="url(#laserRedGlow)" />
      <circle cx="85" cy="42" r="4" fill="#ffffff" />
      <line x1="90" y1="42" x2="155" y2="42" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />
      <text x="98" y="30" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#ef4444">Break Point</text>
    </g>

    <!-- Emergency Dispatch Features -->
    <g transform="translate(15, 145)">
      <rect x="0" y="0" width="180" height="95" rx="4" fill="#060d1d" stroke="#1e293b" />
      <text x="10" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Rapid Response</text>
      <text x="10" y="36" font-family="monospace" font-size="8.5" fill="#22c55e">✓ 24/7 Emergency Dispatch</text>
      <text x="10" y="52" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• OTDR Precise Break Locator</text>
      <text x="10" y="68" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• On-Site Fusion Re-Splicing</text>
      <text x="10" y="84" font-family="sans-serif" font-size="8.5" fill="#e2e8f0">• Strand Polish &amp; Connector Re-term</text>
    </g>
  </g>

  <!-- Bottom Annotation -->
  <g transform="translate(30, 320)">
    <rect x="0" y="0" width="540" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <circle cx="28" cy="24" r="8" fill="#22c55e" opacity="0.2" />
    <circle cx="28" cy="24" r="4" fill="#22c55e" />
    <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Optical Fiber Diagnostics &amp; Emergency Repair</text>
    <text x="48" y="37" font-family="monospace" font-size="9.5" fill="#38bdf8">Micro-bend detection • Core alignment fusion • Tier 2 OTDR trace validation</text>
  </g>
</svg>
