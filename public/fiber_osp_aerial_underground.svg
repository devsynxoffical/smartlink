<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ospBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#0f1f3d" />
      <stop offset="100%" stop-color="#060b14" />
    </linearGradient>
    <linearGradient id="armorSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#475569" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="peJacket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="domeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0056d2" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#ospBg)" rx="8" />

  <!-- Blueprint / Elevation Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="440" y1="0" x2="440" y2="400" />
    <line x1="560" y1="0" x2="560" y2="400" />
  </g>

  <!-- Left: Armored Multi-Strand Fiber Cable Cross-Section Diagram -->
  <g transform="translate(140, 180)">
    <!-- Outer Heavy-Duty HDPE Polyethylene Jacket -->
    <circle r="110" fill="url(#peJacket)" stroke="#475569" stroke-width="4" />
    
    <!-- Corrugated Steel Tape Armor Ring -->
    <circle r="96" fill="none" stroke="url(#armorSteel)" stroke-width="6" stroke-dasharray="8,4" />
    
    <!-- Water-Blocking Gel / Aramid Yarn Layer -->
    <circle r="88" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Central Strength Member (FRP Rod) -->
    <circle r="22" fill="#cbd5e1" stroke="#475569" stroke-width="2" />
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#0f172a">FRP</text>

    <!-- 12 TIA-598 Color-Coded Buffer Tubes Orbiting Central Member -->
    <!-- 1. Blue -->
    <circle cx="0" cy="-55" r="16" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="0" cy="-55" r="4" fill="#ffffff" filter="url(#glowEffect)" />
    <!-- 2. Orange -->
    <circle cx="28" cy="-48" r="16" fill="#f97316" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="28" cy="-48" r="4" fill="#ffffff" />
    <!-- 3. Green -->
    <circle cx="48" cy="-28" r="16" fill="#16a34a" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="48" cy="-28" r="4" fill="#ffffff" />
    <!-- 4. Brown -->
    <circle cx="55" cy="0" r="16" fill="#854d0e" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="55" cy="0" r="4" fill="#ffffff" />
    <!-- 5. Slate (Grey) -->
    <circle cx="48" cy="28" r="16" fill="#64748b" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="48" cy="28" r="4" fill="#ffffff" />
    <!-- 6. White -->
    <circle cx="28" cy="48" r="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="28" cy="48" r="4" fill="#0f172a" />
    <!-- 7. Red -->
    <circle cx="0" cy="55" r="16" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="0" cy="55" r="4" fill="#ffffff" />
    <!-- 8. Black -->
    <circle cx="-28" cy="48" r="16" fill="#020617" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="-28" cy="48" r="4" fill="#ffffff" />
    <!-- 9. Yellow -->
    <circle cx="-48" cy="28" r="16" fill="#eab308" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="-48" cy="28" r="4" fill="#ffffff" />
    <!-- 10. Violet -->
    <circle cx="-55" cy="0" r="16" fill="#9333ea" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="-55" cy="0" r="4" fill="#ffffff" />
    <!-- 11. Rose (Pink) -->
    <circle cx="-48" cy="-28" r="16" fill="#ec4899" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="-48" cy="-28" r="4" fill="#ffffff" />
    <!-- 12. Aqua -->
    <circle cx="-28" cy="-48" r="16" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="-28" cy="-48" r="4" fill="#ffffff" />

    <!-- Annotation Pointer Lines -->
    <line x1="75" y1="-75" x2="110" y2="-95" stroke="#38bdf8" stroke-width="1.5" />
    <text x="115" y="-93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#38bdf8">HDPE JACKET + ARMOR</text>

    <line x1="-75" y1="-75" x2="-110" y2="-95" stroke="#facc15" stroke-width="1.5" />
    <text x="-115" y="-93" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#facc15">144-STRAND OSP CORE</text>
  </g>

  <!-- Right: Outdoor Dome Splice Enclosure & Underground / Aerial Spec Sheet -->
  <g transform="translate(320, 50)">
    <!-- Splice Enclosure Blueprint Card -->
    <rect x="0" y="0" width="250" height="280" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    
    <!-- Top Header -->
    <rect x="12" y="12" width="226" height="34" rx="4" fill="#1e293b" stroke="#334155" />
    <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="1">OUTSIDE PLANT (OSP) FIBER</text>

    <!-- Waterproof Dome Splice Silhouette Graphic -->
    <g transform="translate(40, 60)">
      <!-- Dome Enclosure Base & Clamps -->
      <rect x="0" y="40" width="46" height="70" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <!-- Dome Top -->
      <path d="M0,40 C0,10 46,10 46,40 Z" fill="#334155" stroke="#475569" stroke-width="2" />
      <!-- Clamp Ring -->
      <rect x="-4" y="38" width="54" height="8" rx="2" fill="url(#armorSteel)" />
      <!-- Cable Entry Ports Bottom -->
      <rect x="4" y="110" width="8" height="20" rx="2" fill="#090d16" />
      <rect x="18" y="110" width="10" height="24" rx="2" fill="#090d16" stroke="#0056d2" />
      <rect x="34" y="110" width="8" height="20" rx="2" fill="#090d16" />

      <!-- Splice details text -->
      <text x="65" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">IP68 Dome Closure</text>
      <text x="65" y="60" font-family="monospace" font-size="9" fill="#22c55e">✓ Watertight &amp; Pressurized</text>
      <text x="65" y="75" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Aerial Strand &amp; Handhole</text>
      <text x="65" y="90" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Direct Burial Armored</text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(18, 200)">
      <rect x="0" y="0" width="214" height="64" rx="4" fill="#060d1d" stroke="#1e293b" />
      <text x="12" y="18" font-family="monospace" font-size="9.5" fill="#38bdf8" font-weight="bold">DEPLOYMENT METHODS:</text>
      <text x="12" y="34" font-family="sans-serif" font-size="9" fill="#e2e8f0">• Directional Boring &amp; Conduit</text>
      <text x="12" y="48" font-family="sans-serif" font-size="9" fill="#e2e8f0">• Aerial Pole Lashing &amp; Figure-8</text>
    </g>
  </g>

  <!-- Bottom Annotation -->
  <g transform="translate(30, 345)">
    <rect x="0" y="0" width="220" height="40" rx="6" fill="#1e293b" opacity="0.95" stroke="#334155" />
    <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">TIA-598 Color Code Standard</text>
    <text x="12" y="30" font-family="monospace" font-size="9" fill="#22c55e">Armored &amp; All-Dielectric (ADSS)</text>
  </g>
</svg>
