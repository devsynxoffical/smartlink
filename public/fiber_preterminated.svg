<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="fiberPreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="60%" stop-color="#0f1f3d" />
      <stop offset="100%" stop-color="#050b18" />
    </linearGradient>
    <linearGradient id="aquaOm4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="yellowOs2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="mtpBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#fiberPreBg)" rx="8" />

  <!-- Technical Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="250" x2="600" y2="250" />
    <line x1="0" y1="350" x2="600" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
  </g>

  <!-- Pre-Terminated MPO/MTP Multi-Fiber Trunk Cables (Aqua OM4 & Yellow OS2) -->
  <!-- Cable 1 (Aqua OM4 Ribbon Trunk) -->
  <path d="M-20,110 C100,110 140,160 260,160" fill="none" stroke="url(#aquaOm4)" stroke-width="14" stroke-linecap="round" />
  <path d="M-20,110 C100,110 140,160 260,160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />

  <!-- Cable 2 (Yellow OS2 Single-Mode Trunk) -->
  <path d="M-20,290 C120,290 150,220 260,220" fill="none" stroke="url(#yellowOs2)" stroke-width="14" stroke-linecap="round" />
  <path d="M-20,290 C120,290 150,220 260,220" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />

  <!-- Cable 3 (Aqua OM4 Jumper) -->
  <path d="M-20,170 C90,170 160,190 260,190" fill="none" stroke="url(#aquaOm4)" stroke-width="10" stroke-linecap="round" />

  <!-- High-Density Fiber Optic Enclosure / Cassette Module (Right side) -->
  <g transform="translate(260, 60)">
    <!-- Main Cassette Enclosure -->
    <rect x="0" y="0" width="300" height="260" rx="8" fill="url(#silverPlate)" stroke="#0056d2" stroke-width="2" />
    <rect x="8" y="8" width="284" height="244" rx="6" fill="#0b132b" stroke="#1e293b" stroke-width="1.5" />

    <!-- Cassette Header Plate -->
    <rect x="18" y="18" width="264" height="32" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="1">MTP-24 / LC OM4 CASSETTE</text>
    <circle cx="260" cy="34" r="5" fill="#22c55e" filter="url(#laserGlow)" />

    <!-- Optical Adapter LC Duplex Ports Grid -->
    <!-- Row 1: OM4 Aqua Ports (Ports 1-6) -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="36" height="42" rx="3" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="1" />
      <rect x="6" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <rect x="20" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <circle cx="11" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="25" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />

      <rect x="44" y="0" width="36" height="42" rx="3" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="1" />
      <rect x="50" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <rect x="64" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <circle cx="55" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="69" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />

      <rect x="88" y="0" width="36" height="42" rx="3" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="1" />
      <rect x="94" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <rect x="108" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <circle cx="99" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="113" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />

      <rect x="132" y="0" width="36" height="42" rx="3" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="1" />
      <rect x="138" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <rect x="152" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <circle cx="143" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="157" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />

      <rect x="176" y="0" width="36" height="42" rx="3" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="1" />
      <rect x="182" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <rect x="196" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <circle cx="187" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="201" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />

      <rect x="220" y="0" width="36" height="42" rx="3" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="1" />
      <rect x="226" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <rect x="240" y="8" width="10" height="26" rx="2" fill="#00e5ff" />
      <circle cx="231" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="245" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
    </g>

    <!-- Row 2: OS2 Yellow Ports (Ports 7-12) -->
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="36" height="42" rx="3" fill="#facc15" opacity="0.15" stroke="#facc15" stroke-width="1" />
      <rect x="6" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <rect x="20" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <circle cx="11" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="25" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />

      <rect x="44" y="0" width="36" height="42" rx="3" fill="#facc15" opacity="0.15" stroke="#facc15" stroke-width="1" />
      <rect x="50" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <rect x="64" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <circle cx="55" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="69" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />

      <rect x="88" y="0" width="36" height="42" rx="3" fill="#facc15" opacity="0.15" stroke="#facc15" stroke-width="1" />
      <rect x="94" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <rect x="108" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <circle cx="99" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="113" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />

      <rect x="132" y="0" width="36" height="42" rx="3" fill="#facc15" opacity="0.15" stroke="#facc15" stroke-width="1" />
      <rect x="138" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <rect x="152" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <circle cx="143" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="157" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />

      <rect x="176" y="0" width="36" height="42" rx="3" fill="#facc15" opacity="0.15" stroke="#facc15" stroke-width="1" />
      <rect x="182" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <rect x="196" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <circle cx="187" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="201" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />

      <rect x="220" y="0" width="36" height="42" rx="3" fill="#facc15" opacity="0.15" stroke="#facc15" stroke-width="1" />
      <rect x="226" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <rect x="240" y="8" width="10" height="26" rx="2" fill="#facc15" />
      <circle cx="231" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
      <circle cx="245" cy="21" r="2" fill="#ffffff" filter="url(#laserGlow)" />
    </g>

    <!-- Pre-Terminated Factory QC Badge -->
    <rect x="20" y="180" width="256" height="48" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="32" y="200" font-family="monospace" font-size="10.5" fill="#22c55e" font-weight="bold">✓ 100% FACTORY TESTED (IL &lt; 0.20dB)</text>
    <text x="32" y="216" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Ultra-Low Insertion Loss • MPO/MTP Elite</text>
  </g>

  <!-- MPO Connector Head on Left Trunk Cable -->
  <g transform="translate(230, 145)">
    <rect x="0" y="0" width="36" height="30" rx="3" fill="url(#mtpBody)" stroke="#475569" stroke-width="1.5" />
    <!-- Connector Clip -->
    <rect x="8" y="-4" width="20" height="6" rx="1" fill="#00e5ff" />
    <!-- Alignment Pins -->
    <circle cx="6" cy="15" r="1.5" fill="#e2e8f0" />
    <circle cx="30" cy="15" r="1.5" fill="#e2e8f0" />
  </g>

  <!-- Tech Specs Badge -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="230" height="42" rx="6" fill="#1e293b" opacity="0.95" stroke="#334155" />
    <text x="14" y="18" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#ffffff">Plug-and-Play Architecture</text>
    <text x="14" y="32" font-family="monospace" font-size="9" fill="#38bdf8">10G • 40G • 100G • 400G Optical Ready</text>
  </g>
</svg>
