<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="racewayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f20" />
      <stop offset="50%" stop-color="#0b1730" />
      <stop offset="100%" stop-color="#040813" />
    </linearGradient>
    <linearGradient id="yellowDuct" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="yellowDuctInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="aquaCables" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="yellowCables" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#racewayBg)" rx="8" />

  <!-- Data Center Rack Silhouettes in Background -->
  <g opacity="0.15">
    <rect x="50" y="220" width="130" height="180" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="230" y="220" width="130" height="180" fill="#334155" stroke="#475569" stroke-width="2" />
    <rect x="410" y="220" width="130" height="180" fill="#334155" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Main Overhead Yellow Fiber Ducting Channel (FiberRunner 4x4 / 4x8 system) -->
  <g transform="translate(0, 70)">
    <!-- Main Channel Body -->
    <rect x="-10" y="0" width="620" height="60" fill="url(#yellowDuct)" stroke="#a16207" stroke-width="2.5" />
    
    <!-- Channel Lip / Cover Rail Top & Bottom -->
    <rect x="-10" y="-4" width="620" height="8" fill="#ca8a04" />
    <rect x="-10" y="56" width="620" height="8" fill="#a16207" />

    <!-- Interior Cavity View (Hinged Cover Section Open) -->
    <rect x="20" y="10" width="560" height="40" rx="3" fill="url(#yellowDuctInterior)" stroke="#713f12" stroke-width="1.5" />

    <!-- Bundles of Yellow OS2 and Aqua OM4 Optical Strands Running Horizontally -->
    <!-- Yellow OS2 Single-Mode Strands -->
    <line x1="20" y1="20" x2="580" y2="20" stroke="url(#yellowCables)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="20" y1="26" x2="580" y2="26" stroke="url(#yellowCables)" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="32" x2="580" y2="32" stroke="url(#yellowCables)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Aqua OM4 Multimode Strands -->
    <line x1="20" y1="38" x2="580" y2="38" stroke="url(#aquaCables)" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="44" x2="580" y2="44" stroke="url(#aquaCables)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Channel System Branding Label -->
    <g transform="translate(40, 16)">
      <rect x="0" y="0" width="110" height="18" rx="2" fill="#0f172a" opacity="0.9" />
      <text x="8" y="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="900" fill="#facc15" letter-spacing="0.5">FIBER-RACEWAY™</text>
    </g>

    <!-- Waterfall Drop-Out Fitting Center (Smooth 30mm Minimum Bend Radius Exit) -->
    <g transform="translate(260, 56)">
      <!-- Smooth Curved Exit Trumpet -->
      <path d="M0,0 C0,40 30,70 70,70 L90,70 C130,70 160,40 160,0 Z" fill="url(#yellowDuct)" stroke="#a16207" stroke-width="2" />
      <path d="M15,0 C15,30 35,55 70,55 L90,55 C125,55 145,30 145,0 Z" fill="url(#yellowDuctInterior)" />

      <!-- Optical Cables Cascading Down Waterfall Drop into Server Rack -->
      <!-- Aqua OM4 Drop Cables -->
      <path d="M40,0 C40,40 60,65 80,180" fill="none" stroke="url(#aquaCables)" stroke-width="5" stroke-linecap="round" />
      <path d="M48,0 C48,40 66,65 86,180" fill="none" stroke="url(#aquaCables)" stroke-width="4" stroke-linecap="round" />
      
      <!-- Yellow OS2 Drop Cables -->
      <path d="M90,0 C90,40 85,75 100,180" fill="none" stroke="url(#yellowCables)" stroke-width="5" stroke-linecap="round" />
      <path d="M102,0 C102,40 95,75 110,180" fill="none" stroke="url(#yellowCables)" stroke-width="4" stroke-linecap="round" />
      <path d="M115,0 C115,40 105,75 118,180" fill="none" stroke="url(#yellowCables)" stroke-width="3" stroke-linecap="round" />

      <!-- Bend Radius Guide Indicator -->
      <path d="M20,15 A30,30 0 0,0 50,45" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,3" />
      <circle cx="50" cy="45" r="3" fill="#22c55e" />
    </g>
  </g>

  <!-- Left Technical Spec Card -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="180" height="90" rx="6" fill="#0f172a" opacity="0.95" stroke="#1e293b" stroke-width="1.5" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#facc15">Fiber Bend Control</text>
    <text x="14" y="44" font-family="monospace" font-size="9" fill="#22c55e">✓ R &gt; 30mm Radius Safe</text>
    <text x="14" y="60" font-family="sans-serif" font-size="9" fill="#94a3b8">Zero Macro-Bending Loss</text>
    <text x="14" y="76" font-family="sans-serif" font-size="9" fill="#94a3b8">Overhead Yellow Raceway</text>
  </g>

  <!-- Right Technical Spec Card -->
  <g transform="translate(380, 240)">
    <rect x="0" y="0" width="180" height="90" rx="6" fill="#0f172a" opacity="0.95" stroke="#1e293b" stroke-width="1.5" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">Pathway Standards</text>
    <text x="14" y="44" font-family="monospace" font-size="9" fill="#e2e8f0">TIA-569-E / TIA-942-B</text>
    <text x="14" y="60" font-family="sans-serif" font-size="9" fill="#94a3b8">Segregated Optical Paths</text>
    <text x="14" y="76" font-family="sans-serif" font-size="9" fill="#22c55e">Data Center &amp; MDF Ready</text>
  </g>
</svg>
